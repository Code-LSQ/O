<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>O</title>
    <style>
      :root {
        --bg: #ffffff;
        --border: #e5e7eb;
        --text: #1f2937;
        --text-dim: #9ca3af;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 321px;
        max-height: 480px;
        overflow-y: auto;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 14px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        font-weight: 600;
      }
      #viewBtn,
      #optionBtn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3px 8px;
        flex: none;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-size: 12px;
        font-weight: 400;
      }
      #viewBtn:hover,
      #optionBtn:hover { background: var(--border); }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .row:hover { background: #f3f4f6; }
      .row.off { opacity: 0.5; }
      .row .icon { width: 20px; height: 20px; flex: none; border-radius: 3px; }
      .row .info { flex: 1; min-width: 0; }
      .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row .version { color: var(--text-dim); font-size: 11px; }
      .row .desc { color: var(--text-dim); font-size: 11px; }
      .icon-letter {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        flex: none;
        border-radius: 3px;
        background: var(--border);
        color: var(--text);
        font-size: 11px;
        font-weight: 600;
      }
      .desc-btn {
        flex: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font-size: 11px;
        padding: 2px 8px;
        cursor: pointer;
      }
      .desc-btn:hover { background: var(--border); }
      .mhead {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
      }
      #backBtn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2px 8px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-size: 14px;
      }
      #backBtn:hover { background: var(--border); }
      #moduleBody { padding: 8px 14px; }
      #list.view-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        padding: 0;
      }
      #list.view-grid .row {
        position: relative;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 12px 4px 8px;
        border: 1px solid var(--border);
        min-width: 0;
      }
      #list.view-grid .row .icon { width: 24px; height: 24px; }
      #list.view-grid .row .icon-letter { width: 24px; height: 24px; font-size: 13px; }
      #list.view-grid .row .desc {
        font-size: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }
      #list.view-grid .row .desc-btn {
        position: absolute;
        bottom: 4px;
        right: 4px;
      }
      #list.view-grid .row .name {
        width: 100%;
        font-size: 12px;
        text-align: center;
        white-space: pre-line;
        display: -webkit-box;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      #list.view-grid .row .version { font-size: 10px; text-align: center; }
      .empty {
        padding: 24px 14px;
        text-align: center;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <header>
      <button id="viewBtn" title="切换显示" aria-label="切换显示"></button>
      <button id="optionBtn" title="设置" aria-label="设置">设置</button>
    </header>
    <div id="list"></div>
    <div id="moduleView" hidden>
      <div class="mhead">
        <button id="backBtn" title="返回" aria-label="返回">←</button>
        <span id="moduleTitle"></span>
      </div>
      <div id="moduleBody"></div>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
