name: Build / Release

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $VER = "$env:GITHUB_REF_NAME" -replace '^v',''
          "version=$VER" >> $env:GITHUB_OUTPUT

      - name: Verify version matches
        shell: pwsh
        run: |
          $CODE = Get-Content -Raw 'src/util.py'
          $CODE_VER = [regex]::Match($CODE, 'VERSION = "([^"]+)"').Groups[1].Value
          $TAG_VER = "$env:GITHUB_REF_NAME" -replace '^v',''
          if ($CODE_VER -ne $TAG_VER) {
            Write-Host "版本不一致: tag=$TAG_VER, src/util.py VERSION=$CODE_VER"
            exit 1
          }

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python test.py --all

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $TAG = "$env:GITHUB_REF_NAME"
          gh release view "$TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            $PREV = (gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>$null)
            $BODY = if ($PREV) { "**Full Changelog**: https://github.com/$env:GITHUB_REPOSITORY/compare/$PREV...$TAG" } else { "" }
            gh release create "$TAG" --title "$TAG" --notes "$BODY" --latest
          }

  build-windows:
    needs: [deploy]
    strategy:
      matrix:
        include:
          - architecture: x64
            os: windows-latest
          - architecture: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python build.py

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path ../dist/O -DestinationPath Windows_${{ matrix.architecture }}.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload ${{ github.ref_name }} Windows_${{ matrix.architecture }}.zip --clobber

