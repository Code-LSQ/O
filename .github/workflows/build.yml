name: Build / Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:


jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      matrix:
        architecture: [ x64, arm64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

  build-linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            deb_arch: amd64
            appimage_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}

  build-macos:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            openssl_workaround: 'false'
          - arch: x64
            runner: macos-15-intel
            openssl_workaround: 'true'
    runs-on: ${{ matrix.runner }}
